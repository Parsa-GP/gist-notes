<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Note Editor</title>
    <script src="./openpgp.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
		<div id="left">
			<div id="action-btns">
				<button id="loadBtn">Refresh</button>
				<button id="saveBtn">Save to Gist</button>
			</div>

			<div id="tree"></div>

			<div id="config">
                <div>
                    <span id="cfg-title">Configuration</span>
                </div>
                <div>
                    <span>GitHub Token:</span>
                    <input type="text" id="githubToken">
                </div>
                <div>
                    <span>Gist ID (leave empty to create new):</span>
                    <input type="text" id="gistId">
                </div>
                <div>
                    <span>PGP Public Key:</span>
                    <textarea id="pgpPublic" style="width:100%;height:100px;"></textarea>
                </div>
                <div>
                    <span>PGP Private Key:</span>
                    <textarea id="pgpPrivate" style="width:100%;height:100px;"></textarea>
                </div>
                <div>
                    <span>PGP Passphrase:</span>
                    <input type="password" id="pgpPassphrase" autocomplete="off">
                </div>
                <div>
                    <button id="saveConfig">Save Config</button>
                    <button id="exportConfig">Export Config</button>
                    <input type="file" id="importFile" style="display:none;">
                    <button id="importConfig">Import Config</button>
                </div>
			</div>
		</div>
        <span id="gap"></span>
		<div id="right">
			<textarea id="editor"></textarea>
		</div>
	</div>
	<script src="./script.js"></script>    
</body>
</html>
